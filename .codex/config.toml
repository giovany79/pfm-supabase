[mcp_servers.pfm_finance]
url = "https://pfm-supabase.vercel.app/api/mcp"
bearer_token_env_var = "MCP_ACTIONS_API_KEY"
enabled = true
required = false
default_tools_approval_mode = "prompt"
startup_timeout_sec = 15
tool_timeout_sec = 30

[mcp_servers.pfm_finance.tools.query_transactions]
approval_mode = "approve"

[mcp_servers.pfm_finance.tools.query_snapshots]
approval_mode = "approve"

[mcp_servers.pfm_finance.tools.aggregate_transactions]
approval_mode = "approve"

[mcp_servers.pfm_finance.tools.confirm_transaction_change]
approval_mode = "prompt"

[mcp_servers.pfm_finance.tools.confirm_snapshot_change]
approval_mode = "prompt"
